<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        iframe {
            width: 100%;
            height: 450px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Google Maps Search</h2>
    
    <div class="input-group">
        <label for="street">Street:</label>
        <input type="text" id="street" placeholder="e.g. Mukkulankatu">
    </div>
    
    <div class="input-group">
        <label for="city">City:</label>
        <input type="text" id="city" placeholder="e.g. Lahti">
    </div>
    
    <button onclick="searchLocation()">Search</button>

    <div>
        <iframe id="mapFrame" 
            src="https://maps.google.com/maps?q=Lahti&output=embed" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>
</div>

<script>
    function searchLocation() {
        const street = document.getElementById('street').value.trim();
        const city = document.getElementById('city').value.trim();
        
        if (street === "" && city === "") {
            alert("Please enter a street or city name.");
            return;
        }
        
        const query = encodeURIComponent(street + ", " + city);
        const iframe = document.getElementById('mapFrame');
        iframe.src = `https://maps.google.com/maps?q=${query}&output=embed`;
    }
</script>

</body>
</html>
